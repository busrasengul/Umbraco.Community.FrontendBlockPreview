# Checks for dependency updates on the 1st and 15th of each month and opens one pull request per branch and ecosystem.
# Each pull request is assigned to the maintainer (which sends an email) and runs the build.
# Major versions are ignored, so every branch stays on its own Umbraco major.
# v19 is added once Umbraco 19 packages are published.

version: 2

updates:
  # NuGet: Umbraco.Cms.* (package and test site), central versions in src/Directory.Packages.props
  - package-ecosystem: "nuget"
    directory: "/src"
    target-branch: "v17"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      v17-dependencies:
        patterns: [ "*" ]
    commit-message:
      prefix: "v17"

  - package-ecosystem: "nuget"
    directory: "/src"
    target-branch: "v18"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      v18-dependencies:
        patterns: [ "*" ]
    commit-message:
      prefix: "v18"

  # npm: the backoffice client (@umbraco-cms/backoffice, Vite, TypeScript)
  - package-ecosystem: "npm"
    directory: "/src/Umbraco.Community.FrontendBlockPreview/Client"
    target-branch: "v17"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      v17-client:
        patterns: [ "*" ]
    commit-message:
      prefix: "v17"

  - package-ecosystem: "npm"
    directory: "/src/Umbraco.Community.FrontendBlockPreview/Client"
    target-branch: "v18"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    ignore:
      - dependency-name: "*"
        update-types: [ "version-update:semver-major" ]
    groups:
      v18-client:
        patterns: [ "*" ]
    commit-message:
      prefix: "v18"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v17"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    groups:
      v17-actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "v17"

  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "v18"
    schedule:
      interval: "cron"
      cronjob: "0 9 1,15 * *"
      timezone: "Europe/London"
    assignees: [ "busrasengul" ]
    groups:
      v18-actions:
        patterns: [ "*" ]
    commit-message:
      prefix: "v18"
